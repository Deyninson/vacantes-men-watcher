name: Vacantes MEN Watcher

on:
  schedule:
    # Cada 30 minutos (hora UTC). 21:00 Colombia = 02:00 UTC del día siguiente.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: vacantes-men
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verificar Chrome preinstalado
        run: |
          google-chrome --version || chromium --version || {
            echo "No se encontró Chrome; instalando..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          }

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar vigilante
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_GITHUB_STATE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node watcher.js
